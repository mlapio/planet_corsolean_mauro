name: Continuous Delivery - Ticka .NET Staging

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-dotnet-staging:
    name: Build & Deploy .NET to Staging
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (v8.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build & Publish .NET Release
        run: dotnet publish -c Release -o ./publish

      - name: Setup SSH Key & Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add Host to Known Hosts (Anti-MITM)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H "staging.planet.it" >> ~/.ssh/known_hosts

      - name: Generate Config & Deploy via rsync
        env:
          DB_CONNECTION_STRING: ${{ secrets.STAGING_DB_CONN }}
        run: |
          envsubst < ./publish/appsettings.template.json > ./publish/appsettings.json
          rsync -az --delete             --exclude="uploads/"             --exclude="logs/"             ./publish/ deploy-user@staging.planet.it:/var/www/ticka/

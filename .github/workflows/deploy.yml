name: Deploy On-Premise Transazionale

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Codice
        uses: actions/checkout@v4

      - name: Packaging dell'Artefatto
        run: tar -czf release.tar.gz --exclude='.git' .
      - name: Trasferimento ed Esecuzione Deploy Atomico via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TAG=${GITHUB_REF#refs/tags/}
            RELEASE_DIR="/var/www/releases/$TAG"
            mkdir -p $RELEASE_DIR
            tar -xzf /tmp/release.tar.gz -C $RELEASE_DIR
            ln -sfn $RELEASE_DIR /var/www/current
      - name: Rollback Automatico in caso di errore
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "⚠️ Deploy fallito! Ripristino versione precedente..."
            PREV_RELEASE=$(ls -td /var/www/releases/* | sed -n '2p')
            if [ -n "$PREV_RELEASE" ]; then
              ln -sfn $PREV_RELEASE /var/www/current
              echo "✓ Rollback completato a: $PREV_RELEASE"
            fi
